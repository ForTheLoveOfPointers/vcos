image boot.vfat {
	vfat {
		label = "VCOSBOOT"
		file EFI/BOOT/BOOTX64.EFI {
			image = "efi-part/EFI/BOOT/BOOTX64.EFI"
		}
		file EFI/BOOT/grub.cfg {
			image = "efi-part/EFI/BOOT/grub.cfg"
		}
		file boot/bzImage {
			image = "efi-part/boot/bzImage"
		}
	}
	size = 64M
}

image vcos.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition boot {
		image = "boot.vfat"
		partition-type-uuid = "U"
		bootable = true
		offset = 1M
		size = 64M
	}

	partition rootfs {
		image = "rootfs.ext2"
		partition-type-uuid = "L"
		partition-uuid = "7f0d6c3a-1b2c-4d3e-8f90-0123456789ab"
		offset = 65M
		size = 512M
	}

	partition data {
		image = "vcos-data.ext4"
		partition-type-uuid = "L"
		partition-uuid = "9a8b7c6d-5e4f-4a3b-9c2d-1e0f2a3b4c5d"
		offset = 577M
		size = 128M
	}
}
